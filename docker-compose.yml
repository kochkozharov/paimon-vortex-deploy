name: paimon-flink

x-flink-build: &flink-build
  build:
    context: .
    dockerfile: Dockerfile.flink

services:

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/warehouse &&
        echo 'Bucket ready.'
      "
    restart: "no"

  jobmanager:
    <<: *flink-build
    container_name: jobmanager
    hostname: jobmanager
    ports:
      - "8081:8081"
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
    command: jobmanager
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  taskmanager:
    <<: *flink-build
    container_name: taskmanager
    hostname: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_EC2_METADATA_DISABLED: "true"
      # object_store (rust crate в vortex-jni) по умолчанию требует HTTPS.
      # MinIO у нас по http — разрешаем явно.
      AWS_ALLOW_HTTP: "true"
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy

  sql-gateway:
    <<: *flink-build
    container_name: sql-gateway
    hostname: sql-gateway
    ports:
      - "8083:8083"
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
    entrypoint: /sql-gateway-start.sh
    depends_on:
      jobmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  minio-data:
