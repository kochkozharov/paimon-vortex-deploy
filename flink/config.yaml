jobmanager.rpc.address: "jobmanager"
jobmanager.rpc.port: 6123
jobmanager.memory.process.size: 1600m

taskmanager.memory.process.size: 1728m
taskmanager.numberOfTaskSlots: 4

parallelism.default: 2

rest.address: "jobmanager"
rest.port: 8081

sql-gateway.endpoint.rest.address: "0.0.0.0"
sql-gateway.endpoint.rest.port: 8083

execution.target: remote

# Hadoop-aws S3A через commons-logging держит classloader user-code в static field.
# При concurrent jobs (streaming writer + batch reader на одном TM) старый user
# classloader закрывается, новый job падает на "Trying to access closed classloader".
# Отключаем strict-check — утечка в hadoop-aws library, не наш баг.
classloader.check-leaked-classloader: false

# Не рестартить упавший job — для бенчмарка лучше явный fail чем infinite retry-loop.
restart-strategy.type: none

env.java.opts.all: "--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED"

execution.checkpointing.interval: 10s
execution.checkpointing.mode: EXACTLY_ONCE
state.checkpoints.dir: s3a://warehouse/checkpoints

fs.s3a.endpoint: "http://minio:9000"
fs.s3a.access.key: "minioadmin"
fs.s3a.secret.key: "minioadmin"
fs.s3a.path.style.access: "true"
fs.s3a.connection.ssl.enabled: "false"
fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
fs.s3a.attempts.maximum: 1
