# ── Flink 2.x configuration (flat YAML, backward-compatible format) ──────────

# Cluster
jobmanager.rpc.address: "jobmanager"
jobmanager.rpc.port: 6123
jobmanager.memory.process.size: 1600m

taskmanager.memory.process.size: 1728m
taskmanager.numberOfTaskSlots: 4

parallelism.default: 2

# REST / Web UI
# rest.address is used for both binding (on jobmanager) and connecting (on clients).
# The container hostname "jobmanager" resolves correctly within the Docker network,
# and Docker's port-mapping makes localhost:8081 reachable from the host as well.
rest.address: "jobmanager"
rest.port: 8081

# SQL Gateway REST endpoint (inside the sql-gateway container)
sql-gateway.endpoint.rest.address: "0.0.0.0"
sql-gateway.endpoint.rest.port: 8083

# Target cluster for SQL Gateway job submission
execution.target: remote

# ── Checkpointing (required for Paimon to commit data) ───────────────────────
execution.checkpointing.interval: 10s
execution.checkpointing.mode: EXACTLY_ONCE
state.checkpoints.dir: s3a://warehouse/checkpoints

# ── S3A filesystem → MinIO ────────────────────────────────────────────────────
# Paimon warehouse uses s3a://warehouse/paimon
# flink-s3-fs-hadoop plugin wraps Hadoop S3A and is loaded from plugins/.
fs.s3a.endpoint: "http://minio:9000"
fs.s3a.access.key: "minioadmin"
fs.s3a.secret.key: "minioadmin"
fs.s3a.path.style.access: "true"
fs.s3a.connection.ssl.enabled: "false"
fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
# Disable AWS SDK retries on 404 — speeds up first-time bucket access
fs.s3a.attempts.maximum: 1
